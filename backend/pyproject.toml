[tool.poetry]
name = "document-parser-backend"
version = "1.0.0"
description = "智能文档解析平台后端服务"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.27"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
celery = "^5.3.6"
redis = "^5.0.1"
minio = "^7.2.4"
pymupdf = "^1.24.0"
pillow = "^10.2.0"
openai = "^1.12.0"
httpx = "^0.26.0"
python-multipart = "^0.0.9"
defusedxml = "^0.7.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyyaml = "^6.0.1"
greenlet = "^3.5.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
ruff = "^0.2.0"
mypy = "^1.8.0"
ipython = "^8.21.0"


[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle 错误
    "W",  # pycodestyle 警告
    "F",  # pyflakes 检查
    "I",  # isort 导入顺序
    "B",  # flake8-bugbear 检查
    "C4", # flake8-comprehensions 检查
    "UP", # pyupgrade 检查
]
ignore = [
    "E501",  # 行过长（由 black 处理）
    "B008",  # 参数默认值中调用函数
    "C901",  # 复杂度过高
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
