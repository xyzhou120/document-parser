# ==================== 生产环境 ====================
# 仅包含应用容器，连接外部服务

services:
  # 后端API服务
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: doc-parser-backend-prod
    environment:
      # Environment overrides supplement config/local.yaml, mounted below.
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}

      # Redis配置
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # MinIO配置
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_SECURE: ${MINIO_SECURE:-}

      # Celery配置
      # Optional overrides; leave unset to use celery settings from config/local.yaml.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}

      # 模型服务配置
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-}
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-}

    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: doc-parser-celery-worker-prod
    environment:
      # 数据库配置
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}

      # Redis配置
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # MinIO配置
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_SECURE: ${MINIO_SECURE:-}

      # Celery配置
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}

      # 模型服务配置
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      TEXT_LLM_BASE_URL: ${TEXT_LLM_BASE_URL:-}
      TEXT_LLM_API_KEY: ${TEXT_LLM_API_KEY:-}
      TEXT_LLM_MODEL: ${TEXT_LLM_MODEL:-}
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-}

    restart: unless-stopped
    volumes:
      - ../config:/app/config:ro
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
